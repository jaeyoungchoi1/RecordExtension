<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GazeAware Recorder</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>GazeAware</h1>
      </header>

      <section class="section setup-grid">
        <label>
          <span>User ID</span>
          <input id="userId" type="text" inputmode="numeric" autocomplete="off" placeholder="1">
        </label>
        <label>
          <span>Task ID</span>
          <input id="taskId" type="text" autocomplete="off" placeholder="task_001">
        </label>
      </section>

      <section class="section viewport-section">
        <div class="section-header">
          <span>Viewport</span>
          <label class="switch" title="Enable experiment viewport">
            <input id="enabled" type="checkbox">
            <span></span>
          </label>
        </div>
        <div class="grid">
          <label>
            <span>Width</span>
            <input id="viewportWidth" type="number" min="1" step="1" value="1080">
          </label>
          <label>
            <span>Height</span>
            <input id="viewportHeight" type="number" min="1" step="1" value="720">
          </label>
          <label>
            <span>Scroll Step</span>
            <input id="scrollStep" type="number" min="1" step="1" value="500">
          </label>
        </div>
      </section>

      <section class="section">
        <button id="chooseFolder" class="secondary" type="button">Log Folder</button>
        <p id="folderStatus" class="status">No folder selected</p>
      </section>

      <footer class="footer">
        <div class="footer-actions">
          <button id="saveSetup" class="primary" type="button">Start</button>
          <button id="stopRecording" class="secondary" type="button">Stop</button>
        </div>
        <p id="message" class="message" role="status"></p>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
